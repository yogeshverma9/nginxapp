apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    haproxy.org/ssl-redirect: "false"
  labels:
    app: {{ .Values.service.label }}
  name: app-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - {{ .Values.route.host }}
      secretName: {{ .Values.route.tlsSecretName }}
  rules:
    - host: {{ .Values.route.host }}
      http:
        paths:
          - path: {{
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: {{ .Values.service.port }}